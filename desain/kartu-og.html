<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kartu Open Graph</title>
  <style>
    body {
      margin: 0;
    }

    .kartu {
      width: 1200px;
      height: 630px;
      box-sizing: border-box;
      padding: 0 96px;
      display: flex;
      align-items: center;
      gap: 64px;
      background-color: #1D3557;
      color: white;
      font-family: Arial, sans-serif;
      border-bottom: 16px solid #C1121F;
    }

    .kartu img {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 8px solid #C1121F;
      background-color: white;
    }

    .label {
      margin: 0;
      font-size: 28px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #F1FAEE;
    }

    h1 {
      margin: 12px 0;
      font-size: 88px;
    }

    .peran {
      margin: 0;
      font-size: 36px;
    }

    .alamat {
      margin: 40px 0 0;
      font-size: 28px;
      color: #A8DADC;
    }
  </style>
</head>
<body>
  <div class="kartu">
    <img src="../public/foto-profil.png" alt="Foto profil Andi Pratama">
    <div>
      <p class="label">Portofolio</p>
      <h1>Andi Pratama</h1>
      <p class="peran">Calon Junior Web Developer, SMK Mitra</p>
      <p class="alamat">portofolio-next-andi-pratama.vercel.app</p>
    </div>
  </div>
</body>
</html>
